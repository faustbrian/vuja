name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Install supported shells
        run: sudo apt-get update && sudo apt-get install --yes fish zsh

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build ./...

  compatibility:
    name: Compatibility (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go:
          - '1.26.10'
          - '1.27.3'
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install supported shells on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fish zsh

      - name: Install Fish on macOS
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Exercise shell and terminal contracts
        run: go test ./integration/shell ./internal/vt ./root

  distribution:
    name: Distribution (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Build release binary
        shell: bash
        run: |
          VERSION="dev-${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-s -w -X github.com/faustbrian/vuja/v2/root.Version=${VERSION}" \
            -trimpath -o dist/vuja ./cmd/vuja

      - name: Verify native distribution version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          EXPECTED="dev-${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            EXPECTED="${GITHUB_REF_NAME}"
          fi
          test "$(./dist/vuja version)" = "vuja ${EXPECTED}"

      - name: Stage distribution notices
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - name: Preserve release binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vuja-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/vuja
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7

  benchmark-evidence:
    name: Release benchmark evidence
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare isolated evidence workspace
        shell: bash
        run: |
          umask 077
          evidence="$RUNNER_TEMP/vuja-release-evidence"
          mkdir -p "$evidence/reports"
          printf 'EVIDENCE_ROOT=%s\n' "$evidence" >> "$GITHUB_ENV"
          for assignment in GOCACHE=go-cache GOMODCACHE=go-mod GOTMPDIR=go-tmp \
            HOME=home ZDOTDIR=home XDG_CONFIG_HOME=config XDG_DATA_HOME=data \
            XDG_CACHE_HOME=cache XDG_RUNTIME_DIR=runtime; do
            name=${assignment%%=*}
            directory=${assignment#*=}
            mkdir -p "$evidence/$directory"
            printf '%s=%s/%s\n' "$name" "$evidence" "$directory" >> "$GITHUB_ENV"
          done

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false

      - name: Record benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            go version
            uname -a
            lscpu
            free -h
            uptime
          } | tee "$EVIDENCE_ROOT/reports/environment.txt"

      - name: Measure release workloads
        shell: bash
        run: |
          set -euo pipefail
          for variable in "${!VUJA_@}"; do unset "$variable"; done
          measure() {
            local report=$1
            shift
            printf '%q ' "$@" | tee "$EVIDENCE_ROOT/reports/$report.txt"
            printf '\n' | tee -a "$EVIDENCE_ROOT/reports/$report.txt"
            "$@" 2>&1 | tee -a "$EVIDENCE_ROOT/reports/$report.txt"
          }
          measure canonical go test -run '^$' \
            -bench '^BenchmarkCanonicalHistory(ColdPublish100K|ColdStoreLoad100K|WarmSSHPrefix100K|IncrementalSSHPrefix100K)$' \
            -count=3 -benchmem ./integration ./root
          # The fixture reuses IDs after 1,024 operations; stay on new-event
          # publication, not the separate recency-correction rebuild path.
          measure submission go test -run '^$' \
            -bench '^BenchmarkCanonicalHistoryPublishSubmission100K$' \
            -benchtime=100x -count=5 -benchmem ./integration
          measure suggestions go test -run '^$' \
            -bench 'Benchmark(ScoreCandidates|FileGeneratorPrefix|Search.*RichHistory.*10K)$' \
            -count=5 -benchmem ./internal/scoring ./spec ./integration
          measure terminal go test -run '^$' \
            -bench 'Benchmark(Chatbox|MergeResults|Prompt|Repository|Status|SuggestionPipeline|System)' \
            -count=5 -benchmem ./root
          measure retained go test ./internal/vt -run '^$' \
            -bench '^BenchmarkRetainedSession(Footprint|Resize)$' \
            -benchtime=1x -count=3 -benchmem

      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/vuja-release-evidence/reports
          if-no-files-found: error
          retention-days: 7

      - name: Remove isolated evidence workspace
        if: always()
        shell: bash
        run: |
          test -n "$RUNNER_TEMP" && test -d "$RUNNER_TEMP"
          evidence="$RUNNER_TEMP/vuja-release-evidence"
          rm -rf -- "$evidence"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - compatibility
      - distribution
      - benchmark-evidence
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "release tag must point to a commit contained in main" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            RC_PREFIX="${GITHUB_REF_NAME}-rc."
            ACCEPTED_RC=false
            while IFS= read -r candidate; do
              rc_number=${candidate#"${RC_PREFIX}"}
              if [[ "${candidate}" == "${RC_PREFIX}"* && "${rc_number}" =~ ^[1-9][0-9]*$ ]]; then
                ACCEPTED_RC=true
                break
              fi
            done < <(git tag --points-at "${TAG_COMMIT}")
            if [[ "${ACCEPTED_RC}" != true ]]; then
              echo "stable release commit must already carry a matching release-candidate tag" >&2
              exit 1
            fi
          fi

      - name: Download release binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: vuja-*
          path: artifacts

      - name: Package release binaries
        shell: bash
        run: |
          mkdir -p dist
          platforms=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64")
          for platform in "${platforms[@]}"; do
            IFS=/ read -r GOOS GOARCH <<< "$platform"
            source="artifacts/vuja-${GOOS}-${GOARCH}/vuja"
            test -f "$source"
            chmod 0755 "$source"
            tar -czf "dist/vuja_${GOOS}_${GOARCH}.tar.gz" -C "$(dirname "$source")" vuja LICENSE THIRD_PARTY_NOTICES.md
          done
          cd dist
          sha256sum vuja_*.tar.gz > SHA256SUMS

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/vuja_*.tar.gz

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-rc.*}"
          awk -v version="${VERSION}" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md
          cat <<'EOF' >> release_notes.md

          ## Update

          ```bash
          vuja update
          ```
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
