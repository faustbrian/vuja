name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Nightly Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Get version info
        id: version
        run: |
          BASE=$(git describe --tags --abbrev=0 --exclude="*-nightly*" 2>/dev/null || echo "v0.0.0")
          VERSION_NUM=${BASE#v}
          IFS='.' read -r major minor patch <<< "$VERSION_NUM"
          patch=$((patch + 1))
          NEXT_BASE="v${major}.${minor}.${patch}"
          SHORT=$(git rev-parse --short HEAD)
          echo "version=${NEXT_BASE}-nightly.${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          platforms=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64")
          for platform in "${platforms[@]}"; do
            IFS=/ read -r GOOS GOARCH <<< "$platform"

            GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X github.com/faustbrian/vuja/root.Version=${{ steps.version.outputs.version }}" \
              -trimpath -o "dist/vuja" ./cmd/vuja

            cd dist
            tar -czf "vuja_${GOOS}_${GOARCH}.tar.gz" "vuja"
            rm "vuja"
            cd ..
          done

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Nightly release from `${{ github.sha }}`.

            Update with `vuja update`.
          files: dist/*.tar.gz
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
